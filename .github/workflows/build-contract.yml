name: Build contract

# Builds the escrow contract to WebAssembly on GitHub, so nothing needs installing locally.
# Run it from the Actions tab (Run workflow), then download the "portwell-escrow-wasm" artifact.
on:
  workflow_dispatch:
  push:
    paths:
      - "contract/**"
      - ".github/workflows/build-contract.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Run unit tests
        working-directory: contract
        run: cargo test

      - name: Build wasm
        working-directory: contract
        run: cargo near build non-reproducible-wasm

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: portwell-escrow-wasm
          path: contract/target/near/*.wasm
          if-no-files-found: error
